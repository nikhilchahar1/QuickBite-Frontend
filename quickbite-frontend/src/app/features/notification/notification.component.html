<div class="page-header">
  <div class="container">
    <h1>🔔 Notifications</h1>
    <p>{{ unreadCount }} unread notification{{ unreadCount !== 1 ? 's' : '' }}</p>
  </div>
</div>

<div class="container notif-body">

  <app-spinner *ngIf="loading" message="Loading notifications..."></app-spinner>

  <div *ngIf="!loading">

    <!-- Toolbar -->
    <div class="notif-toolbar" *ngIf="notifications.length > 0">
      <span class="notif-count">{{ notifications.length }} total</span>
      <button
        class="btn btn-ghost btn-sm"
        (click)="markAllRead()"
        [disabled]="markingAll || unreadCount === 0">
        {{ markingAll ? 'Marking...' : '✓ Mark all as read' }}
      </button>
    </div>

    <!-- Empty -->
    <div class="empty-state" *ngIf="notifications.length === 0">
      <div class="empty-icon">🔔</div>
      <h3>No notifications yet</h3>
      <p>You'll see order updates, offers and more here</p>
    </div>

    <!-- List -->
    <div class="notif-list" *ngIf="notifications.length > 0">
      <div
        *ngFor="let n of notifications"
        class="notif-item"
        [class.unread]="!n.read"
        (click)="markRead(n.notificationId)">

        <div class="notif-icon-wrap">
          <span class="notif-type-icon">{{ getTypeIcon(n.type) }}</span>
          <span class="unread-dot" *ngIf="!n.read"></span>
        </div>

        <div class="notif-content">
          <div class="notif-title">{{ n.title }}</div>
          <div class="notif-message">{{ n.message }}</div>
          <div class="notif-meta">
            <span class="notif-time">{{ formatDate(n.createdAt) }}</span>
            <span *ngIf="n.type" class="notif-tag">{{ n.type }}</span>
          </div>
        </div>

        <button
          class="notif-delete"
          (click)="$event.stopPropagation(); deleteNotif(n.notificationId)"
          title="Delete">
          ✕
        </button>
      </div>
    </div>
  </div>
</div>
